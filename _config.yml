  facebook: "https://www.facebook.com/jagrukchacha"

# ----- Deployment -----
# GitHub Pages automatically:
#   - Serves assets over HTTP/2
#   - Applies gzip/brotli compression
#   - Caches static assets aggressively
#   - Uses a CDN in front of the site
#
# Custom Cache-Control / Security headers are NOT supported on GitHub Pages.
# Add Cloudflare (free plan) as a proxy in front of the domain to set them.
#
# CSS is cache-busted by query string (?v=10) because the headers above can't
# be tuned. Bump that number in all seven pages whenever styles.css changes.