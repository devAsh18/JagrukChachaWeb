# Site metadata for jagrukchacha.com
#
# NOTE: this file is NOT a Jekyll build config. The repo contains no _layouts,
# no _includes, no .md pages and no front matter — the seven .html files are
# hand-authored and deployed verbatim by .github/workflows/static.yml, which
# uses actions/upload-pages-artifact and never invokes Jekyll. `.nojekyll` is
# committed so Jekyll can never start processing the tree by accident.
#
# Kept as a single source of truth for the values that appear in the HTML's
# SEO tags. If the domain or repo moves, update both this file and the
# canonical/og tags in the pages.

title: Jagruk Chacha
description: "Every Rupee Has a Story. Hindi-first short-form content revealing the hidden economics behind everyday Indian life."
